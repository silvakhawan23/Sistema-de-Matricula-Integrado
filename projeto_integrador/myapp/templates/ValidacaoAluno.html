<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Validação de Aluno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #215732, #32734b);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .container {
            background-color: white;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            background-color: #215732;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #1a4629;
        }

        .erro {
            color: red;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Digite seu CPF para acessar</h2>
        <form method="POST" action="/ValidacaoAluno/">
            {% csrf_token %}
            <label for="cpf"><strong>CPF de Cadastro *</strong></label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
            <button type="submit">Confirmar Identidade</button>

           {% if aprovado %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        </form>
    </div>
</body>
</html>
